name: Refresh staging DB

on:
  schedule:
    - cron: "0 1 * * *" # ~03:00-04:00 Asia/Jerusalem
  workflow_dispatch:

concurrency:
  group: refresh-staging-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Copy production data into staging
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

    steps:
      - name: Checkout staging
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: staging

      - name: Install Postgres 17 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Copy production into staging
        run: bash scripts/refresh-staging-db.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Re-apply staging-only migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm db:migrate
