name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main", "staging"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Typecheck, Test, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_gantt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/school_gantt_test
      # lib/db/client.ts reads DATABASE_URL — point the production client at the same ephemeral DB
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/school_gantt_test

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Typecheck (tsc --noEmit)
        run: pnpm tsc --noEmit

      - name: Provision Supabase-equivalent roles
        # Supabase ships the `authenticated` role by default; vanilla Postgres does not.
        # `withSchool()` runs `SET LOCAL ROLE authenticated`, so the role must exist
        # and have the same table grants `public` has.
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated;
            END IF;
          END $$;
          GRANT USAGE ON SCHEMA public TO authenticated;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO authenticated;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO authenticated;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO authenticated;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO authenticated;
          SQL

      - name: Apply database migrations
        run: |
          for f in db/migrations/*.sql; do
            echo "▶ $f"
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
          # Re-apply grants since migrations created the tables AFTER the role was provisioned.
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO authenticated;"
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO authenticated;"

      - name: Unit + integration tests (Vitest)
        # All integration suites run against the ephemeral Postgres above.
        # seed.test.ts calls the exported seedDb() with a deterministic
        # UUID stub for staff_users.id, so no Supabase Auth project is needed.
        run: pnpm test

      - name: Build
        # SKIP_MIGRATIONS=1: CI already applied migrations in the dedicated
        # "Apply database migrations" step via psql; the prebuild hook would
        # try to replay them and fail on existing objects.
        env:
          SKIP_MIGRATIONS: "1"
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm dlx playwright install chromium --with-deps

      - name: E2E tests (Playwright)
        if: ${{ env.NEXT_PUBLIC_SUPABASE_URL != '' }}
        run: pnpm playwright
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
